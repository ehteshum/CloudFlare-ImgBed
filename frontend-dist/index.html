<script>
!function() {
const removeDocs = () => {
document.querySelectorAll(".el-dropdown-menu__item").forEach((item) => {
const text = (item.textContent || "").replace(/\s+/g, " ").trim();
if (text === "Documentation") {
item.remove();
}
});
};

const removeThemeOption = () => {
document.querySelectorAll("#themeToggle, .toggle-dark-button").forEach((btn) => {
btn.remove();
});
document.querySelectorAll(".el-dropdown-menu__item").forEach((item) => {
const text = (item.textContent || "").replace(/\s+/g, " ").trim();
if (["Light Mode", "Dark Mode", "Auto Mode", "浅色模式", "深色模式", "自动模式"].includes(text)) {
item.remove();
}
});
};

const addClasses = (selector, classes) => {
document.querySelectorAll(selector).forEach((element) => {
element.classList.add(...classes);
});
};

const applyTailwindShell = () => {
document.documentElement.classList.add("bg-slate-950");
document.body.classList.add("bg-slate-950", "text-slate-100", "antialiased");
const appRoot = document.getElementById("app");
if (appRoot) {
appRoot.classList.add("min-h-screen", "bg-slate-950", "text-slate-100");
}

addClasses(".container", ["min-h-screen", "bg-slate-950", "text-slate-100", "font-sans"]);
addClasses(".sidebar-container", ["border-r", "border-slate-800/50", "bg-slate-950", "backdrop-blur-none", "shadow-none"]);
addClasses(".header-content", ["sticky", "top-0", "z-50", "border-b", "border-slate-800/50", "bg-slate-950/70", "backdrop-blur-xl", "shadow-sm", "transition-all"]);
addClasses(".status-panel", ["mx-auto", "w-full", "max-w-[1600px]", "space-y-8", "p-8"]);
addClasses(".upload-settings", ["mx-auto", "w-full", "max-w-[1600px]", "space-y-8", "p-8"]);
addClasses(".overview-cards", ["grid", "gap-6", "sm:grid-cols-2", "xl:grid-cols-3"]);
addClasses(".overview-card", ["rounded-2xl", "border-none", "bg-slate-900", "shadow-sm", "p-8", "transition-all", "duration-300", "ease-out", "hover:-translate-y-1", "hover:shadow-lg", "hover:shadow-black/50", "flex", "flex-col", "justify-between"]);
addClasses(".charts-section", ["grid", "gap-6", "xl:grid-cols-2"]);
addClasses(".chart-card", ["rounded-2xl", "border-none", "bg-slate-900", "shadow-sm", "p-8", "transition-all", "duration-300", "ease-out", "hover:-translate-y-1", "hover:shadow-lg", "hover:shadow-black/50"]);
addClasses(".actions-section", ["space-y-6"]);
addClasses(".action-card", ["rounded-2xl", "border-none", "bg-slate-900", "shadow-sm", "p-8", "transition-all", "duration-300", "ease-out", "hover:-translate-y-1", "hover:shadow-lg", "hover:shadow-black/50"]);
addClasses(".file-info-section", ["grid", "gap-6", "xl:grid-cols-2"]);
addClasses(".file-info-card", ["overflow-hidden", "rounded-2xl", "border-none", "bg-slate-900", "shadow-sm", "transition-all", "duration-300", "ease-out", "hover:-translate-y-1", "hover:shadow-lg"]);
addClasses(".main-table", ["overflow-hidden", "rounded-2xl", "border-none", "bg-slate-900", "shadow-sm"]);
addClasses(".page-header", ["flex", "flex-wrap", "items-center", "justify-between", "gap-6"]);
addClasses(".first-title", ["text-xl", "font-medium", "tracking-tight", "text-slate-100"]);
addClasses(".header-actions", ["flex", "flex-wrap", "items-center", "gap-6"]);
addClasses(".group-header", ["flex", "flex-wrap", "items-center", "justify-between", "gap-6"]);
addClasses(".group-title", ["flex", "items-center", "gap-2", "text-base", "font-medium", "text-slate-100"]);
addClasses(".channel-group", ["overflow-hidden", "rounded-2xl", "border-none", "bg-slate-900", "shadow-sm", "p-6", "transition-all", "duration-300"]);
addClasses(".channel-card", ["overflow-hidden", "rounded-2xl", "border-none", "bg-slate-900", "shadow-md", "p-6", "transition-all", "duration-300", "ease-out", "hover:-translate-y-1", "hover:shadow-lg"]);
addClasses(".card-header", ["flex", "items-center", "justify-between", "gap-6"]);
addClasses(".card-body", ["text-left"]);
addClasses(".card-actions", ["border-t", "border-slate-800/50", "bg-slate-900"]);
addClasses(".el-card", ["rounded-2xl", "border-none", "bg-slate-900", "shadow-sm", "transition-all", "duration-300"]);
addClasses(".el-dropdown-menu", ["overflow-hidden", "rounded-2xl", "border", "border-slate-800", "bg-slate-900", "shadow-md"]);
addClasses(".el-dropdown-menu__item", ["px-3", "py-2", "text-sm", "text-slate-300", "font-medium", "transition-colors", "hover:bg-slate-800"]);
addClasses(".el-button", ["rounded-xl", "border-none", "bg-slate-800", "text-slate-200", "font-medium", "hover:bg-slate-700", "focus:outline-none", "focus:ring-2", "focus:ring-[#f4b400]/50", "transition-all", "duration-300"]);
addClasses(".el-button--primary", ["!bg-[#f4b400]", "!text-black", "shadow-sm", "font-medium", "hover:!bg-[#e0a600]"]);
addClasses(".el-input__wrapper, .custom-select-trigger, .date-input", ["rounded-xl", "border-none", "bg-slate-950", "text-slate-100", "shadow-none", "ring-1", "ring-slate-800", "focus-within:ring-2", "focus-within:ring-[#f4b400]/50", "transition-all", "duration-300"]);
addClasses(".el-select__wrapper", ["rounded-xl", "border-none", "bg-slate-950", "text-slate-100", "shadow-none", "ring-1", "ring-slate-800", "focus-within:ring-2", "focus-within:ring-[#f4b400]/50", "transition-all", "duration-300"]);
addClasses(".el-pagination, .pagination-container", ["text-slate-400"]);
addClasses(".el-upload-dragger", ["rounded-2xl", "border-2", "border-dashed", "border-slate-700", "bg-slate-900/50", "hover:bg-slate-800/80", "transition-colors", "duration-200"]);
removeDocs();
removeThemeOption();

const replaceCameraIcon = () => {
document.querySelectorAll("svg").forEach((svg) => {
const path = svg.querySelector("path");
if (path) {
const d = path.getAttribute("d") || "";
if (d.startsWith("M160 224a64")) {
svg.setAttribute("viewBox", "0 0 1024 1024");
path.setAttribute("d", "M480 480V128a32 32 0 0 1 64 0v352h352a32 32 0 0 1 0 64H544v352a32 32 0 0 1-64 0V544H128a32 32 0 0 1 0-64h352z");
}
}
});
};
replaceCameraIcon();
};

let frame = 0;
const schedule = () => {
cancelAnimationFrame(frame);
frame = requestAnimationFrame(applyTailwindShell);
};

if (document.readyState === "loading") {
document.addEventListener("DOMContentLoaded", schedule, { once: true });
} else {
schedule();
}

window.addEventListener("load", schedule);
new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
}();
</script>

.el-table { background: transparent !important; --el-table-border-color: transparent !important; --el-table-row-hover-bg-color: rgba(30, 41, 59, 0.5) !important; --el-table-header-bg-color: rgba(15, 23, 42, 0.8) !important; }

.el-table td.el-table__cell { border-bottom: 1px solid rgba(51, 65, 85, 0.5) !important; color: #f1f5f9; padding: 16px 0 !important; }
.el-table__inner-wrapper::before { display: none; } /* Removes the heavy bottom border of tables */
.el-pagination { margin-top: 1.5rem; justify-content: flex-end; }

/* 8. Pill-shaped Sidebar Navigation */
.el-menu { background: transparent !important; border-right: none !important; }

.el-menu-item.is-active { background: rgba(244, 180, 0, 0.1) !important; color: #f4b400 !important; font-weight: 600; }
.el-menu-item:hover, .el-sub-menu__title:hover { background: rgba(30, 41, 59, 0.8) !important; color: #f8fafc !important; }

/* 9. Dashboard Typography Emphasis */

.el-upload__text em { color: #f4b400 !important; font-weight: 600; }

/* 11. Performance & Crisp Rendering */
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }

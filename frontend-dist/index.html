});
document.querySelectorAll(".el-dropdown-menu__item").forEach((item) => {
const text = (item.textContent || "").replace(/\s+/g, " ").trim();
if (["Light Mode", "Dark Mode", "Auto Mode", "浅色模式", "深色模式", "自动模式"].includes(text)) {
item.remove();
}
});
};

});
};

if (path) {
const d = path.getAttribute("d") || "";
if (d.startsWith("M160 224a64")) {
svg.setAttribute("viewBox", "0 0 1024 1024");
path.setAttribute("d", "M480 480V128a32 32 0 0 1 64 0v352h352a32 32 0 0 1 0 64H544v352a32 32 0 0 1-64 0V544H128a32 32 0 0 1 0-64h352z");
}
}
});

const moveToolbar = () => {
const header = document.querySelector(".header") || document.querySelector(".page-header") || document.querySelector(".header-content");
const toolbar = document.querySelector(".toolbar");
const toolbarManage = document.querySelector(".toolbar-manage");

if (header && !header.classList.contains("flex")) {
header.classList.add("flex", "items-center", "justify-between", "w-full");
}

if (header && toolbarManage) {
let wrapper = header.querySelector(".hamburger-wrapper");
if (!wrapper) {
wrapper = document.createElement("div");
wrapper.className = "hamburger-wrapper";
header.appendChild(wrapper);
}

if (toolbarManage.parentElement !== wrapper) wrapper.appendChild(toolbarManage);
if (toolbar && toolbar.parentElement !== wrapper) {
wrapper.appendChild(toolbar);
toolbar.classList.add("navbar-integrated-toolbar");
}
}
};
moveToolbar();
};

let frame = 0;
const schedule = () => {
cancelAnimationFrame(frame);
frame = requestAnimationFrame(applyTailwindShell);
};

if (document.readyState === "loading") {
document.addEventListener("DOMContentLoaded", schedule, { once: true });
} else {
schedule();
}

window.addEventListener("load", schedule);
new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
}();
